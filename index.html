<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C3446">
<meta name="description" content="Plataforma KE: todos os sistemas da empresa em um só lugar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plataforma KE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Plataforma KE</title>
<link rel="stylesheet" href="core/inicio.css">
<script src="config.js"></script>
<script>
/* Acessou pelo domínio próprio de uma loja (ex.: lojadamary.com.br)? Abre o site da loja.
   A plataforma (login) só abre em github.io, *.pages.dev, localhost ou nos
   endereços listados em PLAT_CONFIG.hostsPlataforma. */
(function () {
  var h = location.hostname.toLowerCase(), extra = (window.PLAT_CONFIG && PLAT_CONFIG.hostsPlataforma) || [];
  var plataforma = /^(localhost|127\.0\.0\.1)$/.test(h) || /\.github\.io$/.test(h) || /\.pages\.dev$/.test(h) || extra.indexOf(h) >= 0;
  if (!plataforma) location.replace('site/' + location.search + location.hash);
})();
</script>
<script defer src="vendor/supabase.js"></script>
<script defer src="core/plataforma.js"></script>
<script defer src="core/inicio.js"></script>
</head>
<body>

<!-- ============ ENTRADA ============ -->
<section id="tela-entrada" class="entrada" hidden>
  <div class="entrada-card">
    <div class="marca-grande"><span class="k">K</span><span class="e">E</span></div>
    <h1 id="nomePlataforma">Plataforma KE</h1>

    <form id="form-login" class="form">
      <p class="sub">Entre para acessar os sistemas da sua empresa.</p>
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <button class="btn pri" type="submit">Entrar</button>
      <div class="links"><button type="button" class="link" data-ir="cadastro">Criar conta</button><button type="button" class="link" data-ir="esqueci">Esqueci minha senha</button></div>
    </form>

    <form id="form-cadastro" class="form" hidden>
      <p class="sub">Crie sua conta. Depois, o responsável pela empresa libera o seu acesso.</p>
      <label>Seu nome<input name="nome" required autocomplete="name"></label>
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label>Senha <em>(mínimo 6 caracteres)</em><input name="senha" type="password" minlength="6" required autocomplete="new-password"></label>
      <button class="btn pri" type="submit">Criar conta</button>
      <div class="links"><button type="button" class="link" data-ir="login">Já tenho conta</button></div>
    </form>

    <form id="form-esqueci" class="form" hidden>
      <p class="sub">Vamos enviar um link para você criar uma nova senha.</p>
      <label>E-mail<input name="email" type="email" required autocomplete="username"></label>
      <button class="btn pri" type="submit">Enviar link</button>
      <div class="links"><button type="button" class="link" data-ir="login">Voltar</button></div>
    </form>

    <form id="form-nova-senha" class="form" hidden>
      <p class="sub">Digite a sua nova senha.</p>
      <label>Nova senha<input name="senha" type="password" minlength="6" required autocomplete="new-password"></label>
      <button class="btn pri" type="submit">Salvar nova senha</button>
    </form>

    <div id="entrada-msg" class="msg" role="status"></div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="tela-app" hidden>
  <header class="topo">
    <div class="marca"><span class="k">K</span><span class="e">E</span></div>
    <div class="topo-tt">
      <strong id="topoNome">Plataforma KE</strong>
      <select id="selEmpresa" aria-label="Empresa"></select>
    </div>
    <button class="topo-btn" id="btnPerfil" title="Minha conta">👤</button>
  </header>

  <nav class="abas" id="abas">
    <button data-aba="inicio" class="on">🏠 Início</button>
    <button data-aba="clientes">👥 Clientes</button>
    <button data-aba="equipe" hidden>🧑‍🤝‍🧑 Equipe</button>
    <button data-aba="admin" hidden>🛠️ Administração</button>
  </nav>

  <main id="conteudo" class="conteudo"></main>
</div>

<dialog id="modal"><div id="modal-corpo"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
