<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242421">
<title>K&amp;E Obra Fácil | Materiais e instalação</title>
<meta name="description" content="Materiais de acabamento, instalação e obras reais em Manaus. Preços e estoque atualizados em tempo real.">
<meta property="og:type" content="website">
<meta property="og:title" content="K&amp;E Obra Fácil · Materiais e instalação">
<meta property="og:description" content="Pisos, rodapés, ripados e colas com estoque em tempo real. Peça seu orçamento de instalação.">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script src="../vendor/qrcode.js"></script>
<style>
:root{--bg:#f3f1ec;--ink:#242421;--orange:#c65317;--muted:#6e6b65;--line:#dedbd5;--ok:#2d7a46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:11px;font-weight:650}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.zap{background:#1fa855;color:#fff;border-color:#1fa855}
.strip{text-align:center;background:var(--orange);color:#fff;padding:9px;font-size:11px;letter-spacing:1.4px;font-weight:700}
header{background:#242421;color:#fff;padding:22px 20px 30px;text-align:center}
.brand{font-size:32px;font-weight:900;letter-spacing:-2px;color:#ff9855}
.brand small{display:block;font-size:10px;letter-spacing:3px;color:#fff}
h1{font:clamp(32px,5vw,58px)/1.05 Georgia,serif;margin:20px 0 8px}
header p{color:#d9d5ce;margin:8px}
.heroactions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.bar{position:sticky;top:0;z-index:10;background:#f3f1ecf5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px}
.wrap{max-width:1100px;margin:auto}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;background:#fff}
.live{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.live i{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}
.live.on i{background:#2fb35a;box-shadow:0 0 0 0 #2fb35a88;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px #2fb35a00}100%{box-shadow:0 0 0 0 #2fb35a00}}
.tabs,.chips{display:flex;gap:7px;overflow:auto;margin:9px 0 0;scrollbar-width:thin}
.tabs button,.chips button{white-space:nowrap;font-size:12px;border-radius:30px;padding:8px 13px}
.active{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:18px 12px 110px;min-height:50vh}
.sectiontitle{display:flex;align-items:center;gap:12px;margin:18px 0 14px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sectiontitle:after{content:'';height:1px;background:var(--line);flex:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .3s}
.card.flash{box-shadow:0 0 0 3px #ff985588}
.gallery{aspect-ratio:1;position:relative;background:#ebe5da;overflow:hidden;cursor:pointer}
.gallery img,.gallery svg{width:100%;height:100%;object-fit:cover;display:block}
.detailgrid .gallery img{object-fit:contain}
.gallery .slide{position:absolute;inset:0;opacity:0;transition:opacity .65s}
.gallery .slide.on{opacity:1}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:6px;height:6px;background:#aaa;border-radius:50%}.dots i.on{background:var(--orange)}
.tag{position:absolute;top:8px;left:8px;background:#252421;color:#fff;font-size:9px;padding:5px 7px;border-radius:3px;letter-spacing:1px}
.tag.out{background:#8a2a1a}
.body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}
.kicker{font-size:10px;letter-spacing:1.6px;color:var(--orange);text-transform:uppercase}
.body h3{font:bold 19px/1.15 Georgia,serif;margin:0}
.body p,.muted{color:var(--muted);font-size:13px;line-height:1.5}
.body p{margin:0}
.price{font-size:21px;font-weight:750;margin-top:auto;padding-top:8px}
.body button{width:100%;font-size:11px;letter-spacing:.6px}
.step{display:flex;border:1px solid var(--orange);border-radius:6px;overflow:hidden;align-items:center;background:#fff}
.step button{width:38px;border:0;border-radius:0;background:var(--orange);color:#fff;font-size:18px;padding:6px}
.step span{flex:1;text-align:center;font-size:13px}
.cbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 24px));background:var(--ink);color:#fff;padding:12px 15px;border-radius:12px;z-index:20;display:flex;align-items:center;gap:10px;box-shadow:0 6px 25px #0004}
.cbar>div{flex:1}
[hidden]{display:none!important}
dialog{border:0;border-radius:13px;padding:0;width:min(540px,calc(100% - 22px));max-height:92dvh;background:var(--bg);color:var(--ink);overflow:auto}
dialog::backdrop{background:#0009}
dialog.wide{width:min(960px,calc(100% - 22px))}
.modal{padding:22px}
.close{float:right;border-radius:50%;padding:6px 12px}
.detailgrid{display:grid;grid-template-columns:1fr 1fr}
.detailgrid .modal{min-width:0}
.detailgrid .gallery{background:#fff}
.thumbs{display:flex;gap:6px;padding:8px;overflow:auto}
.thumbs button{padding:3px;min-width:55px}
.thumbs img,.thumbs svg{width:50px;height:50px;object-fit:cover;display:block}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line>div{flex:1;min-width:0}
.line .step{width:150px}
.field{display:block;margin:12px 0;font-size:13px;font-weight:650}
.field input,.field select,.field textarea{width:100%;display:block;margin-top:5px;border:1px solid var(--line);border-radius:6px;padding:11px;background:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px;margin:12px 0}
.full{width:100%;margin-top:7px}
.notice{background:#fff0d9;padding:11px;border-radius:6px;font-size:12px;color:#69491e}
.empty{padding:32px;text-align:center;background:#fff;border-radius:9px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
footer{background:#242421;color:#ddd;padding:25px 20px 100px;text-align:center;font-size:12px}
footer a{color:#ff9855}
h2,h3{margin:12px 0}h2{font-family:Georgia,serif}
.badge{display:inline-block;background:#eee6d9;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:700}
.badge.ok{background:#dff1e4;color:var(--ok)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:100;max-width:90%;font-size:13px}
.gallery .slide:not(.on){pointer-events:none}
.video{background:#000;line-height:0;width:100%;height:100%;display:flex;align-items:center}
.video video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.video.yt iframe{width:100%;aspect-ratio:16/9;max-height:100%;border:0}
.mini-vid{width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:#222 center/cover;color:#fff;font-size:18px;text-shadow:0 1px 3px #000}
.qr{width:220px;height:220px;margin:10px auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr svg{width:100%;height:100%;display:block}
.code{font:11px ui-monospace,Consolas,monospace;word-break:break-all;background:#f6f4ef;border-radius:8px;padding:9px;color:var(--muted);user-select:all;text-align:left}
.timer{font-weight:800;color:var(--orange)}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.place{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;text-align:left}
.place b{display:block;font-family:Georgia,serif;font-size:17px}
.skel{background:linear-gradient(90deg,#eee 25%,#f7f7f7 37%,#eee 63%);background-size:400% 100%;animation:sk 1.4s infinite;border-radius:10px;aspect-ratio:.62}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.body{padding:10px}.body h3{font-size:16px}.price{font-size:18px}.detailgrid{grid-template-columns:1fr}.detailgrid .gallery{max-height:40vh}dialog.wide{max-height:96dvh}.modal{padding:16px}.line .step{width:120px}.live span{display:none}}
@media(prefers-reduced-motion:reduce){.slide{transition:none!important}.live.on i{animation:none}}
</style>
</head>
<body>
<div class="strip" id="strip">MATERIAIS • INSTALAÇÃO</div>
<header>
  <div class="brand" id="brand">K&amp;E<small>OBRA FÁCIL</small></div>
  <h1>Do material à instalação.</h1>
  <p id="frase">Acabamentos, serviços e obras reais. Tudo em um só lugar.</p>
  <p id="cidade"></p>
  <div class="heroactions">
    <button class="primary" data-tab="Materiais">Comprar materiais</button>
    <button data-tab="Serviços">Contratar instalação</button>
    <button data-tab="Obras">Conhecer nossas obras</button>
  </div>
</header>
<div class="bar"><div class="wrap">
  <div class="searchrow">
    <input id="search" class="search" placeholder="Busque materiais, serviços ou obras…" type="search" aria-label="Buscar">
    <span class="live" id="live" title="Preços e estoque atualizados automaticamente"><i></i><span>ao vivo</span></span>
  </div>
  <nav id="tabs" class="tabs"></nav>
  <div id="chips" class="chips"></div>
</div></div>
<main class="wrap" id="main"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
<footer>
  <b id="fnome">K&amp;E OBRA FÁCIL</b>
  <p>Materiais e mão de obra<span id="fcidade"></span>.</p>
  <p id="fzap"></p>
  <p class="muted" style="color:#aaa">Preços e disponibilidade atualizados em tempo real. Frete combinado antes do pagamento.</p>
</footer>
<div id="cbar" class="cbar" hidden><div><small id="cartcount"></small><br><b id="carttotal"></b></div><button class="primary" data-act="cart">Ver carrinho</button></div>
<dialog id="detail" class="wide"></dialog>
<dialog id="modal"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
/* =====================================================================
   K&E OBRA FÁCIL — SITE PÚBLICO
   Lê o catálogo do Supabase (função loj_publico_loja) e fica escutando
   mudanças em tempo real: quando a equipe altera preço, estoque, fotos
   ou obras no módulo "Loja / Site", a página se atualiza sozinha.
   Endereço: site/?l=SLUG  (sem ?l= usa PLAT_CONFIG.lojaPadrao)
===================================================================== */
const cfg = window.PLAT_CONFIG || {};
const SLUG = (new URLSearchParams(location.search).get('l') || cfg.lojaPadrao || 'ke').toLowerCase();
const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false, autoRefreshToken: false } });

const $ = id => document.getElementById(id);
const money = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtQ = n => (Number(n) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = x => String(x ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const phone = s => String(s || '').replace(/\D/g, '');
const SERVICOS = ['Piso vinílico', 'Rodapé PVC', 'Ripado PVC', 'Reforma completa'];
const KCART = 'ke-site-cart-' + SLUG, KPED = 'ke-site-pedidos-' + SLUG;

let L = null, PRODUTOS = [], OBRAS = [], versao = 0;
let page = 'Materiais', cat = 'Todos', detailId = null, checkoutMethod = 'pix', ultimoPedido = null;
let cart = ler(KCART, {});

function ler(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch (e) { return d; } }
function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(s, ms = 2600) { $('toast').textContent = s; $('toast').hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').hidden = true, ms); }
const product = id => PRODUTOS.find(p => p.id === id);
const obra = id => OBRAS.find(o => o.id === id);
const items = () => Object.entries(cart).map(([id, qty]) => ({ p: product(id), qty })).filter(x => x.p && x.qty > 0);
function totals() {
  const sub = items().reduce((s, x) => s + Math.round(x.p.price * x.qty * 100), 0) / 100;
  const pix = Math.round(sub * (1 - (L?.pix_desconto || 0) / 100) * 100) / 100;
  return { sub, pix };
}
function zapLink(texto) { return L?.whatsapp ? 'https://wa.me/' + (L.whatsapp.length <= 11 ? '55' : '') + L.whatsapp + '?text=' + encodeURIComponent(texto || '') : ''; }

/* ---------------- dados ---------------- */
async function carregar(primeira) {
  const { data, error } = await db.rpc('loj_publico_loja', { p_slug: SLUG });
  if (error) { if (primeira) foraDoAr('Não foi possível carregar a loja agora. Verifique sua internet e tente de novo.'); return; }
  if (!data) { foraDoAr('Esta loja não está disponível no momento.'); return; }
  const antes = new Map(PRODUTOS.map(p => [p.id, p.price + '|' + p.disponivel]));
  L = data.loja; versao = L.versao;
  PRODUTOS = data.produtos.map(p => ({ ...p, price: Number(p.preco), disponivel: Number(p.disponivel), photos: (p.fotos || []).filter(safePhoto) }));
  OBRAS = data.obras.map(o => { const midia = [...(o.fotos || []), ...(o.videos || [])].filter(safePhoto);
    return { ...o, midia, photos: midia.filter(u => !isVideo(u)), videos: midia.filter(isVideo) }; });
  cabecalho();
  // carrinho nunca maior que o disponível
  let ajustou = false;
  for (const [id, q] of Object.entries(cart)) {
    const p = product(id);
    if (!p) { delete cart[id]; ajustou = true; }
    else if (q > p.disponivel) { if (p.disponivel > 0) cart[id] = p.disponivel; else delete cart[id]; ajustou = true; }
  }
  if (ajustou) { gravar(KCART, cart); toast('O estoque mudou: ajustamos seu carrinho.', 3500); }
  render();
  if (!primeira) {
    PRODUTOS.forEach(p => { const a = antes.get(p.id); if (a && a !== p.price + '|' + p.disponivel) document.querySelector(`[data-card="${p.id}"]`)?.classList.add('flash'); });
    setTimeout(() => document.querySelectorAll('.card.flash').forEach(c => c.classList.remove('flash')), 1600);
    if ($('detail').open && detailId) refreshDetail();
    if ($('modal').open && $('modal').dataset.mode === 'cart') drawCart();
  }
}
function foraDoAr(msg) { $('main').innerHTML = `<div class="empty">${esc(msg)}</div>`; $('tabs').innerHTML = ''; $('chips').innerHTML = ''; $('cbar').hidden = true; setLive(false); }
function cabecalho() {
  const nome = L.nome || 'K&E Obra Fácil';
  document.title = nome + ' | Materiais e instalação';
  const partes = nome.split(/\s+/);
  $('brand').innerHTML = esc(partes[0]) + (partes.length > 1 ? `<small>${esc(partes.slice(1).join(' ').toUpperCase())}</small>` : '');
  if (L.frase) $('frase').textContent = L.frase;
  $('cidade').textContent = L.cidade || '';
  $('fnome').textContent = nome.toUpperCase();
  $('fcidade').textContent = L.cidade ? ' em ' + L.cidade : '';
  $('fzap').innerHTML = L.whatsapp ? `<a href="${esc(zapLink('Olá! Vim pelo site.'))}" target="_blank" rel="noopener">Fale no WhatsApp</a>` : '';
  const s = ['MATERIAIS', 'INSTALAÇÃO'];
  if (L.parcelas > 1) s.push(`ATÉ ${L.parcelas}X NO CARTÃO`);
  if (L.pix && L.pix_desconto > 0) s.push(`${fmtQ(L.pix_desconto)}% OFF NO PIX`);
  $('strip').textContent = s.join(' • ');
}

/* tempo real: a linha da config da loja muda de versão a cada alteração */
let canal = null, pend = null;
function setLive(on) { $('live').classList.toggle('on', !!on); }
function escutar() {
  if (canal || !L) return;
  canal = db.channel('loja-' + L.id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'loj_config', filter: 'empresa_id=eq.' + L.id }, ev => {
      if (!ev.new || ev.new.versao === versao) return;
      if (ev.new.publicado === false) return carregar();
      clearTimeout(pend); pend = setTimeout(() => carregar(), 400);
    })
    .subscribe(st => setLive(st === 'SUBSCRIBED'));
}
// rede de segurança: confere a cada minuto e quando a aba volta a ficar visível
setInterval(() => { if (!document.hidden) carregar(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && L) carregar(); });

/* ---------------- imagens ---------------- */
function safePhoto(x) { return /^https:\/\/[^\s"'<>]+$/i.test(x || ''); }
function art(p, i) {
  const c = norm(p.categoria || p.tipo || '');
  const shape = /cola/.test(c)
    ? '<rect x="70" y="47" width="110" height="145" rx="8" fill="#d1c5b4"/><ellipse cx="125" cy="47" rx="55" ry="14" fill="#777"/><rect x="70" y="85" width="110" height="72" fill="#c65317"/><text x="125" y="125" fill="white" text-anchor="middle" font-size="16">' + esc((p.nome || '').split(' ')[0].toUpperCase().slice(0, 10)) + '</text>'
    : /rodape/.test(c)
    ? '<path d="M24 145 L205 87 L230 112 L49 170Z" fill="#fff" stroke="#c0bcb4"/><path d="M49 170 L230 112 V145 L49 203Z" fill="#d8d6d0"/>'
    : Array.from({ length: /ripad/.test(c) ? 10 : 5 }, (_, j) => `<rect x="${24 + j * (/ripad/.test(c) ? 20 : 40)}" y="36" width="${/ripad/.test(c) ? 14 : 38}" height="175" rx="2" fill="${['#98704a', '#bd9670', '#765336'][(j + i) % 3]}"/>`).join('');
  return `<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração"><rect width="250" height="250" fill="#f3f0e9"/>${shape}<text x="125" y="235" text-anchor="middle" font-size="10" fill="#6e6b65">ILUSTRAÇÃO</text></svg>`;
}
const isVideo = u => /youtube\.com|youtu\.be/i.test(u) || /\.(mp4|webm|mov)(\?|#|$)/i.test(u);
function media(p, i, lista = p.photos, mini = false) {
  if (!lista.length) return art(p, i);
  const u = lista[i];
  if (isVideo(u)) { const y = youtubeId(u); return mini ? `<span class="mini-vid"${y ? ` style="background-image:url('https://i.ytimg.com/vi/${y}/default.jpg')"` : ''}>▶</span>` : videoHTML(u); }
  return `<img loading="lazy" src="${esc(u)}" alt="${esc(p.nome || p.titulo)}">`;
}
function gallery(p, act, auto = true, lista = p.photos) {
  const n = lista.length || 1;
  const sem = p.disponivel !== undefined && p.disponivel <= 0;
  return `<div class="gallery" ${auto && n > 1 ? 'data-auto="1"' : ''} ${act}>${Array.from({ length: n }, (_, i) => `<div class="slide ${i === 0 ? 'on' : ''}">${media(p, i, lista)}</div>`).join('')}
    ${n > 1 && auto ? `<div class="dots">${Array.from({ length: n }, (_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    ${sem ? '<span class="tag out">ESGOTADO</span>' : ''}${auto && p.videos && p.videos.length ? '<span class="tag">▶ VÍDEO</span>' : ''}</div>`;
}
function shift(g, idx) {
  const ss = [...g.querySelectorAll('.slide')]; if (!ss.length) return;
  const k = idx ?? (ss.findIndex(s => s.classList.contains('on')) + 1) % ss.length;
  ss.forEach((s, i) => { s.classList.toggle('on', i === k); if (i !== k) { s.querySelectorAll('video').forEach(v => v.pause()); s.querySelectorAll('iframe').forEach(f => { if (f.dataset.tocou) { f.src = f.src; delete f.dataset.tocou; } }); } else s.querySelectorAll('iframe').forEach(f => f.dataset.tocou = 1); });
  g.querySelectorAll('.dots i').forEach((s, i) => s.classList.toggle('on', i === k));
}
let tick = 0;
setInterval(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || $('modal').open || $('detail').open) return;
  document.querySelectorAll('[data-auto]').forEach((g, i) => {
    const r = g.getBoundingClientRect();
    if ((tick + i) % 3 === 0 && r.bottom > 0 && r.top < innerHeight && !g.matches(':hover')) shift(g);
  });
  tick++;
}, 1200);

/* ---------------- telas ---------------- */
function tab(t) { page = t; cat = 'Todos'; $('search').value = ''; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function stepper(p) {
  const q = cart[p.id] || 0;
  return q ? `<div class="step"><button data-act="menos" data-id="${p.id}" aria-label="Diminuir">−</button><span>${fmtQ(q)} ${esc(p.unidade)}</span><button data-act="mais" data-id="${p.id}" ${q + 1 > p.disponivel ? 'disabled' : ''} aria-label="Aumentar">+</button></div>`

/* Pix Copia e Cola (BR Code) — mesmo padrão do pix/index.html */
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim();
function brcode(pix, valor, txid) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const p = f('00', '01') + f('26', f('00', 'br.gov.bcb.pix') + f('01', pix.chave)) + f('52', '0000') + f('53', '986') +
    (valor > 0 ? f('54', Number(valor).toFixed(2)) : '') + f('58', 'BR') + f('59', (semAcento(pix.nome) || 'RECEBEDOR').slice(0, 25)) +
    f('60', (semAcento(pix.cidade) || 'MANAUS').slice(0, 15)) + f('62', f('05', String(txid).replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}
let timer = null;
function payment(o) {

    ${o.itens.map(i => `<div class="line"><div>${esc(i.nome)}</div><span class="muted">${fmtQ(i.qtd)} ${esc(i.unidade)}</span></div>`).join('')}

    <button class="full" data-act="copiar" data-txt="${esc(o.codigo)}">Copiar número do pedido</button>
    <button class="full" data-act="acompanhar">Acompanhar pedido</button></div>`, 'pay');
  clearInterval(timer);
  const fim = new Date(o.expira_em).getTime();

  tic(); timer = setInterval(tic, 1000);
}

  const { data, error } = await db.rpc('loj_publico_solicitar', { p_slug: SLUG, p_dados: { ...f, telefone: ph, obra: form.dataset.obra, produto: form.dataset.prod } });
  if (error) { btn.disabled = false; btn.textContent = 'Tentar de novo'; toast(error.message || 'Não foi possível enviar.', 5000); return; }
  gravar('ke-site-cliente', { nome: f.nome.trim(), telefone: ph });
  const msg = `Olá! Pedi um orçamento pelo site (protocolo ${data}): ${f.servico}, bairro ${f.bairro}${f.area ? ', ' + f.area + ' m²' : ''}.`;
  showModal(`<div class="modal"><button class="close" data-act="fechar" aria-label="Fechar">×</button><h2>Pedido recebido!</h2>
    <p>Protocolo <b>${esc(data)}</b>. Nossa equipe vai entrar em contato pelo WhatsApp para combinar a visita e o orçamento.</p>
    ${L.whatsapp ? `<a href="${esc(zapLink(msg))}" target="_blank" rel="noopener"><button class="zap full">Adiantar pelo WhatsApp</button></a>` : ''}
    <button class="full" data-act="fechar">Fechar</button></div>`);
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) return tab(t.dataset.tab);
  const c = e.target.closest('[data-cat]'); if (c) { cat = c.dataset.cat; return render(); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'mais': return change(id, 1);
    case 'menos': return change(id, -1);
    case 'produto': $('modal').open && closeModal(); return openProduct(id);
    case 'obra': return openWork(id);
    case 'thumb': return shift(b.closest('.detailgrid').querySelector('.gallery'), +b.dataset.i);
    case 'fechar-det': return $('detail').close();
    case 'fechar': return closeModal();
    case 'cart': return openCart();
    case 'identify': return identify(b.dataset.m);
    case 'add-area': return change(detailId, calc());
    case 'copiar': return copyText(b.dataset.txt);
    case 'copiar-link': return copyText(location.href.split('#')[0] + '#p=' + id);
    case 'quote': $('detail').open && $('detail').close(); return quote(b.dataset.tipo, b.dataset.obra || '', b.dataset.prod || '');
    case 'acompanhar': closeModal(); tab('Meus pedidos'); if (ultimoPedido) setTimeout(() => findOrder(ultimoPedido.codigo, ultimoPedido.telefone), 50); return;
    case 'ver-pedido': return findOrder(b.dataset.cod, b.dataset.fone);
    case 'repagar': { const d = findOrder.ultimo; if (d) payment({ ...d }); return; }
    case 'local': page = 'Obras'; cat = 'Todos'; $('search').value = b.dataset.local; render(); return window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') return render();
  if (e.target.id === 'area' || e.target.id === 'waste') return calc();
});
document.addEventListener('change', e => {
  if (e.target.name === 'delivery') { const ent = e.target.value === 'Entrega'; $('endbox').hidden = !ent; e.target.form.address.required = ent; }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'pedido') return createOrder(new FormData(e.target));
  if (f === 'quote') return saveQuote(e.target);
  if (f === 'consultar') { const d = new FormData(e.target); return findOrder(String(d.get('code')).trim().toUpperCase(), phone(d.get('phone'))); }
});
$('detail').addEventListener('close', () => { detailId = null; $('detail').querySelectorAll('video').forEach(v => v.pause()); $('detail').innerHTML = ''; if (location.hash) history.replaceState(null, '', location.pathname + location.search); });
$('modal').addEventListener('close', () => clearInterval(timer));
window.addEventListener('storage', e => { if (e.key === KCART) { cart = ler(KCART, {}); render(); } });

/* ---------------- início ---------------- */
(async () => {
  await carregar(true);
  if (!L) return;
  escutar();
  const h = location.hash.match(/^#p(?:roduto)?=([\w-]+)$/);
  if (h && product(h[1])) openProduct(h[1]);
})();
})();
</script>
