<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giro Fácil | Demonstração</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#18372e;font:16px system-ui}header{background:#143b32;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}small{color:#66756e}header small{color:#c8e4d8}main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px}section{background:white;border:1px solid #e0e7e3;border-radius:18px;padding:22px}button,select,input{font:inherit;border:1px solid #d6e2dc;border-radius:10px;padding:12px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e5f3eb}.primary{background:#176947;color:white;border:0;width:100%;font-weight:bold}.primary:hover{background:#11583b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{text-align:left;min-height:90px;font-weight:600}.product span{display:block;color:#176947;margin-top:8px}.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;gap:8px}.big{font-size:32px;font-weight:750}label{display:block;margin:12px 0 4px}input,select{width:100%}nav{display:flex;gap:8px;padding:12px 5%;background:white;flex-wrap:wrap}#report{grid-column:1/-1}.note{padding:12px;background:#fff1d6;border-radius:10px;color:#72521a;font-size:13px}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px}#report{grid-column:auto}}</style><header><div><b style="font-size:25px">giro fácil.</b><br><small>Seu negócio, sob controle.</small></div><span>Modo demonstração</span></header><nav><button onclick="document.getElementById('pos').scrollIntoView()">Nova venda</button><button onclick="document.getElementById('report').scrollIntoView()">Meu caixa</button><button onclick="window.print()">Imprimir resumo</button></nav><main><section id="pos"><small>ATENDIMENTO</small><h1>O que vamos vender?</h1><div class="grid" id="products"></div></section><section><small>PEDIDO ATUAL</small><h2>Seu pedido</h2><div id="cart"></div><p>Total <span class="big" id="total"></span></p><label for="method">Pagamento</label><select id="method"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select><p><button class="primary" id="finish">Finalizar venda</button></p><div id="msg" role="status"></div></section><section id="report"><small>GESTÃO DO CAIXA</small><h2>Movimento do caixa</h2><div class="note">Dados de demonstração gravados apenas neste navegador. Não é um caixa fiscal nem monitoramento remoto.</div><div id="summary"></div><label for="opening">Fundo inicial (R$)</label><input id="opening" type="number" min="0" step=".01" value="0"><label for="out">Retiradas em dinheiro (R$)</label><input id="out" type="number" min="0" step=".01" value="0"><label for="count">Dinheiro contado (R$)</label><input id="count" type="number" min="0" step=".01" value="0"><p id="difference"></p><h3>Histórico de vendas</h3><div id="history"></div></section></main><script>const items=[['Espeto de carne',1000],['Espeto de frango',800],['Marmita',2000],['Refrigerante',600],['Bolo (fatia)',700],['Café',400]], q=items.map(()=>0), $=id=>document.getElementById(id), money=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let sales=[];try{sales=JSON.parse(localStorage.getItem('giro.demo.v1')||'[]')}catch{};const total=()=>q.reduce((a,n,i)=>a+n*items[i][1],0);function render(){ $('products').innerHTML=items.map((p,i)=>'<button class="product" onclick="add('+i+')">'+p[0]+'<span>'+money(p[1])+' +</span></button>').join('');$('cart').innerHTML=q.map((n,i)=>n?'<div class="line">'+items[i][0]+' <button onclick="sub('+i+')">−</button>'+n+'<button onclick="add('+i+')">+</button>'+money(n*items[i][1])+'</div>':'').join('')||'<small>Selecione um produto.</small>';$('total').textContent=money(total());$('finish').disabled=!total();const sum=m=>sales.filter(s=>!m||s.method===m).reduce((a,s)=>a+s.total,0);$('summary').innerHTML=['','Pix','Dinheiro','Cartão'].map(m=>'<div class="line">'+(m||'Total vendido')+'<b>'+money(sum(m))+'</b></div>').join('');$('history').innerHTML=sales.slice().reverse().map(s=>'<div class="line">'+new Date(s.time).toLocaleString('pt-BR')+' · '+s.method+'<b>'+money(s.total)+'</b></div>').join('')||'Nenhuma venda registrada.';const val=id=>Math.round(Math.max(0,Number($(id).value)||0)*100), expected=val('opening')+sum('Dinheiro')-val('out');$('difference').textContent='Esperado: '+money(expected)+' | Diferença: '+money(val('count')-expected)}function add(i){q[i]++;render()}function sub(i){q[i]=Math.max(0,q[i]-1);render()}$('finish').onclick=()=>{if(!total())return;const next=[...sales,{time:new Date().toISOString(),method:$('method').value,total:total(),items:q.map((n,i)=>({name:items[i][0],quantity:n,price:items[i][1]})).filter(x=>x.quantity)}];try{localStorage.setItem('giro.demo.v1',JSON.stringify(next))}catch{$('msg').textContent='Não foi possível salvar. Venda não concluída.';return}sales=next;q.fill(0);$('msg').textContent='Venda registrada com sucesso.';render()};['opening','out','count'].forEach(id=>$(id).oninput=render);render()</script></html>
